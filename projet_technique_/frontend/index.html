<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Blog Spartel</title>
    <!-- Importation simplifiée de Tailwind CSS via CDN pour l'apprentissage -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configuration des couleurs primaires (optionnel, mais garde la maquette jolie) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: { 50: '#f0f6ff', 500: '#2673e8', 600: '#1c5bba', 900: '#0a2042' } }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-100 text-gray-800 flex h-screen overflow-hidden">

    <!-- BARRE LATÉRALE (Sidebar) -->
    <aside class="w-64 bg-gray-900 text-white flex flex-col hidden md:flex">
        <div class="p-6 border-b border-gray-800">
            <h2 class="text-xl font-bold">Admin Blog</h2>
            <p class="text-xs text-primary-500 mt-1 uppercase font-semibold tracking-wider">Sprint 1</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#"
                class="block px-4 py-2 rounded text-gray-400 hover:bg-gray-800 hover:text-white transition-colors">Tableau
                de bord</a>
            <!-- Lien actif -->
            <a href="#" class="block px-4 py-2 rounded bg-primary-600 text-white font-medium">Catégories</a>
        </nav>
    </aside>

    <!-- CONTENU PRINCIPAL -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">

        <!-- ENTÊTE (Header) -->
        <header class="bg-white h-16 border-b border-gray-200 flex items-center justify-between px-6">
            <div class="font-medium text-gray-600">
                Gestion des catégories
            </div>
            <div class="flex items-center gap-2">
                <span class="text-sm font-semibold">Admin</span>
            </div>
        </header>

        <!-- ZONE DE TRAVAIL (Main) -->
        <main class="flex-1 overflow-y-auto p-6 bg-gray-50">
            <div class="max-w-5xl mx-auto space-y-8">

                <!-- SECTION 1 : EN-TÊTE DE LA PAGE -->
                <div class="flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Catégories</h1>
                        <p class="text-sm text-gray-500">Organisez les rubriques de votre blog.</p>
                    </div>
                    <!-- Bouton pour afficher le formulaire (l'action JS sera codée à l'étape 4) -->
                    <button id="btn_addcategory"
                        class="bg-primary-600 text-white px-4 py-2 rounded shadow hover:bg-primary-700 transition">
                        + Nouvelle Catégorie
                    </button>
                </div>

                <!-- SECTION 2 : FORMULAIRE D'AJOUT/MODIFICATION (Caché par défaut) -->
                <div id="section_form" class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 hidden">
                    <h2 class="text-lg font-bold mb-4">Ajouter / Modifier une catégorie</h2>
                    <form id="form_category">

                        <label for="nom" class="block">Nom de category :</label>

                        <input type="text" id="nom" placeholder="Nom de category..." class="mb-4 w-full border p-3"
                            required>

                        <label for="desc" class="block">Description de category :</label>

                        <textarea id="desc" placeholder="Description de category..." class="mb-4 w-full border p-3"
                            required></textarea>

                        <button type="submit" id="btn_submit"
                            class="inline-flex items-center justify-center gap-2 rounded bg-blue-500 px-4 py-2 font-bold text-white transition duration-200 ease-in-out hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:cursor-not-allowed disabled:opacity-75">
                            <svg id="spinner" class="hidden h-4 w-4 animate-spin" xmlns="http://www.w3.org/2000/svg"
                                fill="none" viewBox="0 0 24 24" aria-hidden="true">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                    stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z">
                                </path>
                            </svg>
                            <span id="btn_text">Enregistrer</span>
                        </button>
                        <button type="button" id="btn_annuler"
                            class="ml-2 rounded bg-gray-300 px-5 py-2">Annuler</button>
                    </form>
                </div>

                <!-- SECTION 3 : LISTE DES CATÉGORIES -->
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="p-4 text-sm font-semibold text-gray-500 uppercase">Nom</th>
                                <th class="p-4 text-sm font-semibold text-gray-500 uppercase">Description</th>
                                <th class="p-4 text-sm font-semibold text-gray-500 uppercase text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="table_category" class="divide-y divide-gray-100">
                            <!-- Les données seront injectées ici par JavaScript (app.js) -->
                        </tbody>
                    </table>
                    <div id="toast_con" class="fixed top-4 right-4 z-50"></div>
                </div>

            </div>
        </main>
    </div>

    <!-- Script SPA -->
    <script src="js/main.js"></script>
</body>

</html>
