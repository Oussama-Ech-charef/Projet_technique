<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Catégories</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex h-screen bg-gray-50 text-gray-800">
    <aside class="hidden w-64 flex-col bg-gray-900 text-white md:flex">
        <div class="border-b border-gray-800 p-6">
            <h2 class="text-xl font-bold">Admin Blog</h2>
        </div>
        <nav class="p-4"><span class="block rounded bg-blue-700 px-4 py-2 font-medium">Catégories</span></nav>
    </aside>
    <div class="flex flex-1 flex-col overflow-hidden">
        <header class="flex h-16 items-center justify-between border-b bg-white px-6">
            <span class="font-medium text-gray-600">Gestion des catégories</span><span
                class="text-sm font-semibold">Admin</span>
        </header>
        <main class="flex-1 overflow-y-auto p-4 md:p-6">
            <div class="mx-auto max-w-5xl space-y-6">
                <div class="flex flex-wrap items-center justify-between gap-4">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Catégories</h1>
                        <p class="text-sm text-gray-500">Organisez les rubriques de votre blog.</p>
                    </div>
                    <button id="btn-show-form" type="button"
                        class="rounded bg-blue-700 px-4 py-2 text-white hover:bg-blue-800">+ Nouvelle catégorie</button>
                </div>
                <section id="section-form" class="hidden rounded-lg border bg-white p-6 shadow-sm">
                    <h2 class="mb-4 text-lg font-bold">Ajouter une catégorie</h2>
                    <form id="form-category" class="space-y-4">
                        <div><label for="nom" class="mb-1 block font-semibold">Nom de la catégorie</label><input
                                id="nom" type="text" required class="w-full rounded border p-3"
                                placeholder="Nom de la catégorie"></div>
                        <div><label for="desc" class="mb-1 block font-semibold">Description</label><textarea
                                id="desc" required class="w-full rounded border p-3"
                                placeholder="Description de la catégorie"></textarea></div>
                        <div class="flex gap-2"><button id="btn-submit" type="submit"
                                class="inline-flex items-center gap-2 rounded bg-blue-700 px-4 py-2 font-semibold text-white disabled:opacity-60"><svg
                                    id="spinner" class="hidden h-4 w-4 animate-spin" xmlns="http://www.w3.org/2000/svg"
                                    fill="none" viewBox="0 0 24 24" aria-hidden="true">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                        stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor"
                                        d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                                </svg><span id="btn-text">Enregistrer</span></button><button id="btn-cancel-form"
                                type="button" class="rounded bg-gray-200 px-4 py-2">Annuler</button></div>
                    </form>
                </section>
                <div id="message" role="status" aria-live="polite" class="hidden fixed top-4 right-4 z-50"></div>
                <div class="overflow-x-auto rounded-lg border bg-white shadow-sm">
                    <table class="w-full text-left">
                        <thead class="border-b bg-gray-50">
                            <tr>
                                <th class="p-4 text-sm uppercase text-gray-500">Nom</th>
                                <th class="p-4 text-sm uppercase text-gray-500">Description</th>
                            </tr>
                        </thead>
                        <tbody id="table-category" class="divide-y"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="assets/js/main.js"></script>
</body>

</html>
